spring.application.name=Project-post-comment

spring.datasource.url=jdbc:mysql://localhost:3306/deb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret.key=${JWT_SECRET_KEY}
deploy.env=production

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.com.Project.post_comment.Service=TRACE
logging.pattern.console=%d{dd-MM-yyyy hh:mm:ss} [%level] [%c] %m%n
logging.file.name=arkadeb.log

management.endpoints.web.exposure.include=*
management.info.env.enabled=true

info.app.name=bookMyShow
info.app.version=10.0.3
info.app.url=www.bookmyshow.com

server.port=8081