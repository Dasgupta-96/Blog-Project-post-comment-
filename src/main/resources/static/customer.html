<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Cricket Score</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .scoreboard {
            background: #1e293b;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            width: 500px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .team {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .score {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .details {
            font-size: 18px;
            opacity: 0.8;
        }
        .live-badge {
            background: red;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 15px;
            display: inline-block;
        }
        .updated {
            animation: pulse 0.4s ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="scoreboard" id="board">
    <div class="live-badge">LIVE</div>
    <div class="team" id="teamName">Waiting for match...</div>
    <div class="score" id="score">0 / 0</div>
    <div class="details" id="overs">Overs: 0.0</div>
</div>

<script>
    var socket = new SockJS('/ws');
    var stompClient = Stomp.over(socket);

    stompClient.connect({}, function () {
        console.log("Client Connected");

        stompClient.subscribe("/topic/notification", function (message) {
            var data = JSON.parse(message.body);
            updateScoreboard(data);
        });
    });

    function updateScoreboard(data) {

        document.getElementById("teamName").innerText = data.team;
        document.getElementById("score").innerText =
            data.runs + " / " + data.wickets;
        document.getElementById("overs").innerText =
            "Overs: " + data.overs;

        var board = document.getElementById("board");
        board.classList.add("updated");
        setTimeout(() => board.classList.remove("updated"), 400);
    }
</script>

</body>
</html>
